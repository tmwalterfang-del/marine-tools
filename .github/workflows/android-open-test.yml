name: Android open-test candidate
on:
  pull_request:
    branches: ['main']
    paths: ['apps/**', 'students/**', 'scripts/**', 'tests/app-*.cjs', 'tests/app-*.mjs', 'package*.json', 'capacitor.config.json', '.github/workflows/android-open-test.yml']
  push:
    branches: ['codex/android-open-test-main-20261105']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate staged app and native adapters
        run: |
          npm run test:app
          npm run test:app:unit
      - name: Generate Android project
        run: npm run app:android:sync
      - name: Build debug APK and optimized unsigned release
        run: |
          chmod +x apps/mobile/android/gradlew
          apps/mobile/android/gradlew -p apps/mobile/android assembleDebug assembleRelease bundleRelease
      - name: Verify package contents and release configuration
        run: |
          python3 scripts/app/check-android-package.py
          test -s apps/mobile/android/app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: marine-tools-open-test-unsigned
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/mapping/release/
            app-artifacts/android/
          if-no-files-found: error
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: marine-tools-open-test-unsigned
          path: app-build
      - run: npm install --prefix /tmp/mt-browser --no-audit --no-fund playwright@1.62.1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NODE_PATH: /tmp/mt-browser/node_modules
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r $(find app-build -name '*debug*.apk' -type f | head -n 1)
            node scripts/app/android-emulator-smoke.cjs
            adb uninstall com.marinetools.app
            keytool -genkeypair -keystore /tmp/mt-test.keystore -storepass android -keypass android -alias androidtest -dname 'CN=Android emulator test' -keyalg RSA -keysize 2048 -validity 2
            "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -n 1)" sign --ks /tmp/mt-test.keystore --ks-key-alias androidtest --ks-pass pass:android --key-pass pass:android --out /tmp/mt-release.apk $(find app-build -name '*release*unsigned*.apk' -type f | head -n 1)
            adb install /tmp/mt-release.apk
            adb shell am start -W -n com.marinetools.app/.MainActivity
            sleep 10
            adb shell pidof com.marinetools.app
            adb logcat -d -s AndroidRuntime:E | tee /tmp/mt-runtime.log
            ! grep -q 'FATAL EXCEPTION' /tmp/mt-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-tools-android-emulator-report
          path: app-artifacts/android/
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix /tmp/mt-browser --no-audit --no-fund playwright@1.62.1
      - run: node /tmp/mt-browser/node_modules/playwright/cli.js install --with-deps webkit
      - run: node scripts/stage-app.mjs
      - name: Test bundled Education and app behavior
        env:
          NODE_PATH: /tmp/mt-browser/node_modules
          MT_QA_ENGINE: webkit
        run: |
          node tests/app-education-package.cjs
          node tests/app-browser-20261027.cjs webkit
