name: Analytics dashboard acceptance

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'usage-analytics.js'
      - 'analytics-v856.js'
      - 'product-v860.js'
      - 'app.js'
      - 'index.html'
      - 'tests/analytics-*'
      - 'docs/ANALYTICS_*'
      - '.github/workflows/analytics-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'usage-analytics.js'
      - 'analytics-v856.js'
      - 'product-v860.js'
      - 'app.js'
      - 'index.html'
      - 'tests/analytics-*'
      - '.github/workflows/analytics-dashboard.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --prefix /tmp/analytics-dom --no-audit --no-fund jsdom@26.1.0 wrangler@4.151.3
      - name: Build the deployable Worker with Wrangler
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node /tmp/analytics-dom/node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir /tmp/analytics-worker
      - name: Worker, loading and failure acceptance with synthetic SQL
        env:
          NODE_PATH: /tmp/analytics-dom/node_modules
          MT_ANALYTICS_WORKER_MODULE: /tmp/analytics-worker/worker-v860-dashboard.js
        run: |
          node tests/analytics-dashboard-20261021.mjs
          node tests/analytics-usage-20261021.mjs
          node tests/qa-preview-isolation-20261016.mjs
          node tests/qa-release-metadata-20261018.mjs
      - name: Share the tested deployable bundle with browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: analytics-worker-build
          path: /tmp/analytics-worker/worker-v860-dashboard.js

  browsers:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --prefix /tmp/analytics-browser --no-audit --no-fund playwright@1.62.1
      - name: Install rendering engine
        run: node /tmp/analytics-browser/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: analytics-worker-build
          path: /tmp/analytics-worker
      - name: Dashboard browser acceptance with synthetic SQL
        env:
          NODE_PATH: /tmp/analytics-browser/node_modules
          MT_ANALYTICS_WORKER_MODULE: /tmp/analytics-worker/worker-v860-dashboard.js
        run: node tests/analytics-dashboard-browser-20261021.cjs ${{ matrix.browser }}
      - name: Save fixture screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-dashboard-${{ matrix.browser }}
          path: qa-education-${{ matrix.browser }}/analytics/
