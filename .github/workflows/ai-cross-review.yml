# Cross-review between the two coding agents that work in this repository (see AGENTS.md):
# - Claude reviews pull requests that Codex (or the owner) opens, and answers "@claude" comments.
# - Codex reviews pull requests that Claude opens (branches claude/...).
# Each job is skipped quietly until its API key is stored as a repository secret:
#   ANTHROPIC_API_KEY  (or CLAUDE_CODE_OAUTH_TOKEN)  for Claude
#   OPENAI_API_KEY                                   for Codex
# Reviews run when a pull request is opened, reopened or marked ready, not on every push.
# Ask for a new review at any time by commenting "@claude review" on the pull request.
name: AI cross-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Pull requests not opened by Claude itself or Dependabot.
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check for Claude credentials
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY" ] || [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ANTHROPIC_API_KEY is not set; skipping Claude review."; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 1
      - name: Claude review
        if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the owner before they merge it. Read AGENTS.md first; its rules are binding.
            Report only high-signal problems that you can verify from the code:
            - code that fails to parse or references something undefined;
            - wrong engineering or navigation results (formula, units, sign, rounding), with an independent hand calculation;
            - input handling: decimal comma, blank fields, invalid ranges, NaN or "—" shown as a valid result;
            - user data: changed localStorage keys, history, backup/CSV formats, translated user content;
            - English text without a Norwegian (nb) translation in the language-*.js catalogues, and 320 px layout breaks;
            - service worker: SHELL entries that do not exist, a changed CACHE without the matching test updates;
            - failing or weakened tests.
            Do not comment on style or preferences. Put each finding as an inline comment on the line, and finish with
            one summary comment listing the findings (or saying that none were found). Do not push commits.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Read,Grep,Glob"

  claude-mention:
    # "@claude ..." in a pull request or review comment from someone with write access.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check for Claude credentials
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY" ] || [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ANTHROPIC_API_KEY is not set; skipping."; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 1
      - name: Claude
        if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --append-system-prompt "Follow AGENTS.md. Never push to main."

  codex-review:
    # Pull requests opened by Claude.
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Check for OpenAI credentials
        id: key
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::OPENAI_API_KEY is not set; skipping Codex review."; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Fetch base and head
        if: steps.key.outputs.ok == 'true'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"
      - name: Codex review
        id: run_codex
        if: steps.key.outputs.ok == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            This is PR #${{ github.event.pull_request.number }} for ${{ github.repository }}, written by Claude.
            Read AGENTS.md first; its rules are binding.
            Review ONLY the changes introduced by the PR:
              git log --oneline ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            Report only verified, high-signal problems: parse errors, wrong calculation or navigation results
            (show an independent hand calculation), decimal-comma or blank-input handling, changes to stored user
            data or export formats, missing Norwegian translations, service-worker SHELL/CACHE mistakes and
            failing or weakened tests. No style comments. Start with a one-line verdict, then list findings with
            file and line. If there are none, say so.

  codex-feedback:
    needs: codex-review
    if: needs.codex-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post Codex review
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '## Codex review\n\n' + process.env.CODEX_FINAL_MESSAGE,
            });
