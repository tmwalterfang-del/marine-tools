name: Secret scan
# The repository is public (AGENTS.md): scan every pull request for committed secrets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks 8.30.1 (MIT) and verify its checksum
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the commits in this pull request
        if: github.event_name == 'pull_request'
        run: /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="origin/${{ github.base_ref }}..HEAD" .
      - name: Scan the checked-out files
        run: /tmp/gitleaks dir --no-banner --redact --config .gitleaks.toml .
