name: Production smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: marine-tools-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static JavaScript checks
        run: |
          node --check release-v857.js
          node --check analytics-v856.js
          node --check weather-map-v854.js
          node --check ui-v854.js
          node --check worker/worker-v857.js
          node --check worker/worker-v857-runtime.js

      - name: Navigation calculation smoke test
        run: node tests/navigation-smoke.mjs

      - name: Production deployment and frontend checks
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: bash tests/production-smoke.sh
