# Gitleaks configuration: default rules plus a narrow allowlist for known false positives.
# Reviewed 2026-11-17 (PR #65). Every entry below is public, non-secret content.
[extend]
useDefault = true

[allowlist]
description = "Known non-secret values"
# localStorage key names such as 'mt.voyageConsumptionCurve.v1' or 'mt-student-labs-v1'.
regexes = ['''^mt[.-][a-zA-Z0-9.-]+$''']
# Test fixture of SHA-256 content hashes for the Education review context; app-dist/ is a generated, ignored build copy.
paths = ['''tests/fixtures/students-full-review-context-20261030\.json''', '''^app-dist/''']
