# Gitleaks configuration: default rules plus narrow allowlists for reviewed false positives.
# Reviewed 2026-11-17 (PR #65). Every entry below is public, non-secret content.
# Single reviewed findings (a SHA-256 hash in the Education review fixture) are listed by fingerprint in .gitleaksignore.
[extend]
useDefault = true

[[allowlists]]
description = "localStorage key names such as mt.voyageConsumptionCurve.v1 or mt-student-labs-v1"
regexes = ['''^mt[.-][a-zA-Z0-9.-]+$''']

[[allowlists]]
description = "app-dist/ is a generated, git-ignored copy of the site"
paths = ['''^app-dist/''']
